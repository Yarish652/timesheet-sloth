[project]
name = "aw-mcp"
version = "0.1.0"
description = "Privacy-first MCP server for ActivityWatch: summaries of your time, never your window titles."
readme = "README.md"
authors = [
    { name = "Yarish", email = "kyarish5@gmail.com" }
]
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
    "aw-client>=0.5.15",
    "mcp[cli]>=2",
    "pydantic>=2.14.1",
]

[project.scripts]
aw-mcp = "aw_mcp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]  # T20: no print() - stdout is the wire

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
