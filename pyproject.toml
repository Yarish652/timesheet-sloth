[project]
name = "timesheet-sloth"
version = "0.1.0"
description = "A fully local agent that turns your ActivityWatch history into standups, timesheets and focus forecasts. TabPFN + Gemma, nothing leaves your machine."
readme = "README.md"
authors = [
    { name = "Yarish", email = "kyarish5@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tabpfn>=9.2",
    "torch>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "httpx>=0.28",
    "rich>=14",
    "typer>=0.16",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=2"]

[project.scripts]
sloth = "sloth.cli:app"

[tool.uv.build-backend]
module-name = "sloth"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real TabPFN model (~15 s, needs cached weights)"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
